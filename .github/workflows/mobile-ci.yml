name: Mobile CI

on:
  push:
    branches: [main, backup_main]
    paths:
      - "chess-mobile-app/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main, backup_main]
    paths:
      - "chess-mobile-app/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck-test-bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-mobile-app/mobile
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: chess-mobile-app/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --cacheDirectory=/tmp/arcane-chess-jest-cache
      - run: npx expo export --platform android --output-dir /tmp/arcane-chess-dist
